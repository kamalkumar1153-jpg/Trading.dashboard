<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal Engine - Live Nifty 50</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-green: #238636;
            --accent-red: #da3633;
            --border-color: #30363d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 16px; }
        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
        .price-display { font-size: 2.2rem; font-weight: bold; color: #58a6ff; text-align: center; margin: 12px 0; }
        .status-badge { font-size: 0.85rem; padding: 4px 8px; border-radius: 4px; background: #21262d; display: inline-block; }
        .btn { background-color: #21262d; color: var(--text-color); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .btn-primary { background-color: var(--accent-green); color: white; border: none; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; }
        .modal-content { background: var(--card-bg); padding: 20px; border-radius: 8px; width: 90%; max-width: 450px; border: 1px solid var(--border-color); }
        input, textarea { width: 100%; padding: 10px; margin: 6px 0 14px 0; background: #0d1117; border: 1px solid var(--border-color); color: white; border-radius: 4px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Signal Engine</h2>
        <button class="btn" onclick="openSettings()">⚙️ Settings</button>
    </div>

    <!-- Live Price Display -->
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span>NIFTY 50 SPOT</span>
            <span id="connectionStatus" class="status-badge" style="color: #ffa657;">Token Needed</span>
        </div>
        <div id="livePrice" class="price-display">₹0.00</div>
        <div style="font-size: 0.8rem; text-align: center; color: #8b949e;">Angel One SmartAPI Live Stream (0ms Delay)</div>
    </div>
</div>

<!-- Settings Modal -->
<div id="settingsModal" class="modal">
    <div class="modal-content">
        <h3>Angel One API Settings</h3>
        
        <label>SmartAPI Key:</label>
        <input type="text" id="apiKeyInput" value="ZSrBL2rK" placeholder="API Key">

        <label>JWT Access Token (Termux से पेस्ट करें):</label>
        <textarea id="jwtTokenInput" rows="5" placeholder="Termux में जनरेट हुआ JWT Token यहाँ पेस्ट करें (eyJhbGci...)"></textarea>

        <div style="display: flex; justify-content: flex-end; gap: 8px;">
            <button class="btn" onclick="closeSettings()">Cancel</button>
            <button class="btn btn-primary" onclick="saveSettings()">Save & Connect</button>
        </div>
    </div>
</div>

<script>
    let config = {
        apiKey: localStorage.getItem('angel_api_key') || 'ZSrBL2rK',
        jwtToken: localStorage.getItem('angel_jwt_token') || ''
    };

    // पेज लोड होने पर पुरानी वैल्यू ऑटो-फ़िल करें
    document.getElementById('apiKeyInput').value = config.apiKey;
    document.getElementById('jwtTokenInput').value = config.jwtToken;

    function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }

    function saveSettings() {
        config.apiKey = document.getElementById('apiKeyInput').value.trim();
        config.jwtToken = document.getElementById('jwtTokenInput').value.trim();

        localStorage.setItem('angel_api_key', config.apiKey);
        localStorage.setItem('angel_jwt_token', config.jwtToken);

        closeSettings();
        fetchNiftySpot();
    }

    async function fetchNiftySpot() {
        if (!config.jwtToken) {
            document.getElementById('connectionStatus').innerText = "Token Missing";
            document.getElementById('connectionStatus').style.color = "#ff4444";
            openSettings();
            return;
        }

        try {
            const response = await fetch('https://apiconnect.angelone.in/rest/secure/angelbroking/order/v1/getLtpData', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json',
                    'X-UserType': 'USER',
                    'X-SourceID': 'WEB',
                    'X-ClientLocalIP': '127.0.0.1',
                    'X-ClientPublicIP': '127.0.0.1',
                    'X-MACAddress': 'MAC',
                    'X-PrivateKey': config.apiKey,
                    'Authorization': 'Bearer ' + config.jwtToken
                },
                body: JSON.stringify({
                    "exchange": "NSE",
                    "tradingsymbol": "NIFTY",
                    "symboltoken": "99926000"
                })
            });

            const result = await response.json();

            if (result.status && result.data) {
                document.getElementById('livePrice').innerText = "₹" + parseFloat(result.data.ltp).toFixed(2);
                document.getElementById('connectionStatus').innerText = "LIVE (Angel One)";
                document.getElementById('connectionStatus').style.color = "#238636";
            } else {
                document.getElementById('connectionStatus').innerText = "Token Expired";
                document.getElementById('connectionStatus').style.color = "#da3633";
                console.error("API Error:", result);
            }
        } catch (err) {
            console.error("Fetch Error:", err);
            document.getElementById('connectionStatus').innerText = "Connection Error";
            document.getElementById('connectionStatus').style.color = "#da3633";
        }
    }

    // हर 1 सेकंड (1000ms) में लाइव डेटा अपडेट करें
    setInterval(fetchNiftySpot, 1000);

    // ऐप शुरू होते ही चेक करें
    if (config.jwtToken) {
        fetchNiftySpot();
    } else {
        openSettings();
    }
</script>

</body>
</html>
