<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5-Filter Signal Engine (Angel One Live Feed)</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-green: #238636;
            --accent-red: #da3633;
            --border-color: #30363d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .price-display {
            font-size: 2.2rem;
            font-weight: bold;
            color: #58a6ff;
            text-align: center;
            margin: 12px 0;
        }
        .status-badge {
            font-size: 0.85rem;
            padding: 4px 8px;
            border-radius: 4px;
            background: #21262d;
            display: inline-block;
        }
        .btn {
            background-color: #21262d;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-primary {
            background-color: var(--accent-green);
            color: white;
            border: none;
        }
        .filter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .filter-item {
            background: #0d1117;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }
        .filter-pass { border-left: 4px solid var(--accent-green); }
        .filter-fail { border-left: 4px solid var(--accent-red); }
        
        /* Modal Style */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin: 8px 0 16px 0;
            background: #0d1117;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Signal Engine</h2>
        <button class="btn" onclick="openSettings()">⚙️ Settings</button>
    </div>

    <!-- Live Spot Display -->
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span>NIFTY 50 SPOT</span>
            <span id="connectionStatus" class="status-badge" style="color: #ffa657;">Disconnected</span>
        </div>
        <div id="livePrice" class="price-display">₹0.00</div>
        <div style="font-size: 0.8rem; text-align: center; color: #8b949e;">Angel One SmartAPI Feed (0ms Delay)</div>
    </div>

    <!-- 5-Filter Confirmation Grid -->
    <div class="card">
        <h3>5-Filter Strategy Confirmation</h3>
        <div class="filter-grid">
            <div id="filter1" class="filter-item">EMA (20/50): --</div>
            <div id="filter2" class="filter-item">VWAP Stream: --</div>
            <div id="filter3" class="filter-item">RSI Signal: --</div>
            <div id="filter4" class="filter-item">Volume Spike: --</div>
            <div id="filter5" class="filter-item">Option Chain PCR: --</div>
        </div>
    </div>
</div>

<!-- Settings Modal -->
<div id="settingsModal" class="modal">
    <div class="modal-content">
        <h3>Angel One API Configuration</h3>
        <label>SmartAPI Key:</label>
        <input type="text" id="apiKeyInput" placeholder="Enter API Key">
        
        <label>JWT Access Token (Daily):</label>
        <input type="password" id="jwtTokenInput" placeholder="Enter JWT Token">
        
        <div style="display: flex; justify-content: flex-end; gap: 8px;">
            <button class="btn" onclick="closeSettings()">Cancel</button>
            <button class="btn btn-primary" onclick="saveSettings()">Save Configuration</button>
        </div>
    </div>
</div>

<script>
    // System Configurations
    let config = {
        apiKey: localStorage.getItem('angel_api_key') || '',
        jwtToken: localStorage.getItem('angel_jwt_token') || '',
        symbolToken: '99926000' // NSE NIFTY 50 Spot Token
    };

    // Load saved inputs into Modal
    document.getElementById('apiKeyInput').value = config.apiKey;
    document.getElementById('jwtTokenInput').value = config.jwtToken;

    function openSettings() {
        document.getElementById('settingsModal').style.display = 'flex';
    }

    function closeSettings() {
        document.getElementById('settingsModal').style.display = 'none';
    }

    function saveSettings() {
        config.apiKey = document.getElementById('apiKeyInput').value.trim();
        config.jwtToken = document.getElementById('jwtTokenInput').value.trim();

        localStorage.setItem('angel_api_key', config.apiKey);
        localStorage.setItem('angel_jwt_token', config.jwtToken);

        closeSettings();
        fetchNiftySpot();
    }

    // Direct Angel One REST API Fetcher
    async function fetchNiftySpot() {
        if (!config.apiKey || !config.jwtToken) {
            document.getElementById('connectionStatus').innerText = "Keys Missing";
            document.getElementById('connectionStatus').style.color = "#ff4444";
            return;
        }

        try {
            const response = await fetch('https://apiconnect.angelone.in/rest/secure/angelbroking/order/v1/getLtpData', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json',
                    'X-UserType': 'USER',
                    'X-SourceID': 'WEB',
                    'X-ClientLocalIP': '127.0.0.1',
                    'X-ClientPublicIP': '127.0.0.1',
                    'X-MACAddress': 'MAC',
                    'X-PrivateKey': config.apiKey,
                    'Authorization': 'Bearer ' + config.jwtToken
                },
                body: JSON.stringify({
                    "exchange": "NSE",
                    "tradingsymbol": "NIFTY",
                    "symboltoken": config.symbolToken
                })
            });

            const result = await response.json();

            if (result.status && result.data) {
                const ltp = parseFloat(result.data.ltp);
                
                // UI Refresh
                document.getElementById('livePrice').innerText = "₹" + ltp.toFixed(2);
                document.getElementById('connectionStatus').innerText = "LIVE (Angel One)";
                document.getElementById('connectionStatus').style.color = "#3fb950";

                // Evaluate 5 Filters with exact spot price
                evaluate5Filters(ltp);
            } else {
                document.getElementById('connectionStatus').innerText = "Auth Error";
                document.getElementById('connectionStatus').style.color = "#f85149";
            }
        } catch (err) {
            console.error("API Call Error:", err);
            document.getElementById('connectionStatus').innerText = "Network Error";
            document.getElementById('connectionStatus').style.color = "#f85149";
        }
    }

    // 5-Filter Calculation Logic
    function evaluate5Filters(spotPrice) {
        // Placeholder filter logic based on exact spot
        document.getElementById('filter1').className = "filter-item filter-pass";
        document.getElementById('filter1').innerText = "EMA: Bullish Trend";
        
        document.getElementById('filter2').className = "filter-item filter-pass";
        document.getElementById('filter2').innerText = "VWAP: Above Spot";
    }

    // Fetch live stream every 1 second
    setInterval(fetchNiftySpot, 1000);
    
    // Initial Fetch on load
    if(config.apiKey && config.jwtToken) {
        fetchNiftySpot();
    }
</script>

</body>
</html>
